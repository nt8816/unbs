<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="unbs-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="128" fill="url(#unbs-grad)" />
  
  <!-- Subtle Internal Grid Pattern -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" />

  <!-- Center White Shield Badge -->
  <path d="M256 96 C 330 96, 384 130, 384 180 C 384 290, 290 380, 256 416 C 222 380, 128 290, 128 180 C 128 130, 182 96, 256 96 Z" fill="#ffffff" filter="url(#shadow)" />

  <!-- Cross of Health with Community Nodes -->
  <path d="M228 160 H284 V224 H348 V280 H284 V344 H228 V280 H164 V224 H228 Z" fill="#0284c7" />
  
  <!-- Subtle Heart Accent at center -->
  <circle cx="256" cy="252" r="10" fill="#0d9488" />
</svg>
